[project]
name = "delib"
version = "0.1.0"
description = "DELIB — typed causal-deliberative graph tool for consequence mapping"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "networkx>=3.3",
]

[project.optional-dependencies]
# Added/exercised in later phases; declared here so the seams are visible.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
llm = [
    "litellm>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
