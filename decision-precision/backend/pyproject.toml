[project]
name = "delib"
version = "0.1.0"
description = "DELIB — typed causal-deliberative graph tool for consequence mapping"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "networkx>=3.3",
    "scipy>=1.17.1",
    "scikit-learn>=1.9.0",
    "umap-learn>=0.5.12",
]

[project.optional-dependencies]
# Added/exercised in later phases; declared here so the seams are visible.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
llm = [
    "litellm>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    # Accepted shadow: RegisterEngagement(.Coding).register names the order-of-worth.
    # We never touch BaseModel.register and the API contract needs this field name.
    'ignore:Field name "register" .*shadows an attribute in parent "BaseModel":UserWarning',
]
